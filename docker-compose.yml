version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mailly_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: mailly_user
      POSTGRES_PASSWORD: mailly_password
      POSTGRES_DB: mailly_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mailly_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:
